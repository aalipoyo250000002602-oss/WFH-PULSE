name: iOS simulator build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Capacitor app for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        env:
          VITE_BASE_PATH: ./
          VITE_API_BASE_URL: https://tuypfaqcqsxzuswiglyw.supabase.co/rest/v1/
          VITE_API_BASE_URL_ANDROID: https://tuypfaqcqsxzuswiglyw.supabase.co/rest/v1/
          VITE_SUPABASE_URL: https://tuypfaqcqsxzuswiglyw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm run build

      - name: Sync Capacitor and Swift packages
        run: pnpm exec cap sync ios

      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO
