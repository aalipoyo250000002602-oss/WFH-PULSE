name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
        # If this repo uses npm instead of pnpm, replace with:
        # run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          sudo gem install cocoapods -v '>= 1.11' || true
          pod install --repo-update

      - name: Set Default Scheme
        run: |
          set -euo pipefail

          ws=$(find . -maxdepth 3 -name '*.xcworkspace' -print -quit || true)
          proj=$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit || true)

          if [ -n "$ws" ]; then
            echo "Found workspace: $ws"
            filetype_parameter="workspace"
            file_to_build="$ws"
            xcode_cmd=(xcodebuild -workspace "$ws" -list -json)
          elif [ -n "$proj" ]; then
            echo "Found project: $proj"
            filetype_parameter="project"
            file_to_build="$proj"
            xcode_cmd=(xcodebuild -project "$proj" -list -json)
          else
            echo "::error::No .xcworkspace or .xcodeproj found (searched maxdepth 3). Add the Xcode project or update the workflow's working-directory."
            exit 1
          fi

          scheme_list=$("${xcode_cmd[@]}" 2>/dev/null | tr -d '\n' || true)

          if [ -z "$scheme_list" ]; then
            echo "::error::xcodebuild returned empty output when listing schemes for $file_to_build"
            echo "Raw xcodebuild run (stderr+stdout):"
            "${xcode_cmd[@]}" || true
            exit 1
          fi

          default=$(echo "$scheme_list" | ruby -e "require 'json'; j=JSON.parse(STDIN.read); puts (j.dig('workspace','schemes') || j.dig('project','schemes') || j.dig('project','targets'))&.first")

          if [ -z "$default" ]; then
            echo "::error::Unable to determine default scheme from xcodebuild output for $file_to_build"
            echo "$scheme_list"
            exit 1
          fi

          echo "$default" > default
          echo "$filetype_parameter" > filetype_parameter
          echo "$file_to_build" > file_to_build
          echo "Using default scheme: $default"

      - name: Build
        env:
          platform: iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\\(]+' | head -1 | sed -e 's/ Simulator$//' | awk '{$1=$1;print}')
          scheme=$(cat default)
          filetype_parameter=$(cat filetype_parameter)
          file_to_build=$(cat file_to_build)
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=$device"

      - name: Test
        env:
          platform: iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\\(]+' | head -1 | sed -e 's/ Simulator$//' | awk '{$1=$1;print}')
          scheme=$(cat default)
          filetype_parameter=$(cat filetype_parameter)
          file_to_build=$(cat file_to_build)
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=$device"
