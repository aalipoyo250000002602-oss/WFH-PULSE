name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VITE_BASE_PATH: /WFH-PULSE/
            VITE_API_BASE_URL: https://tuypfaqcqsxzuswiglyw.supabase.co/rest/v1/
            VITE_API_BASE_URL_ANDROID: https://tuypfaqcqsxzuswiglyw.supabase.co/rest/v1/
            VITE_SUPABASE_URL: https://tuypfaqcqsxzuswiglyw.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Build
              run: |
                  if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
                    echo "::error::Set the VITE_SUPABASE_PUBLISHABLE_KEY repository secret to the production publishable key."
                    exit 1
                  fi
                  corepack pnpm run build

            - name: Verify Pages build
              run: node scripts/verify-pages-build.mjs

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
